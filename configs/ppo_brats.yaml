# PPO 에이전트 학습 설정
# 사용 예시: python train_agent.py --config configs/ppo_brats.yaml

# ──────────────────────────────────────────────
# 데이터 설정
# ──────────────────────────────────────────────
# 실제 BraTS 데이터 사용 여부
use_real_data: true

# BraTS2021 데이터 경로 (압축 해제된 폴더)
# BraTS2021은 train/val 분리가 없으므로 동일 경로를 사용하고
# train_agent.py 에서 80/20 분할합니다.
train_root: "src/data/archive"

# MRI 모달리티: t1ce+flair (T1ce + FLAIR 2채널 입력)
modality: "t1ce+flair"

# 2D 슬라이스 해상도
image_size: 128

# 환자 수 제한 (Stage 1–4 공통, run_pipeline.py 기본값과 동일)
max_train_patients: 1251

# ──────────────────────────────────────────────
# RL 환경 설정
# ──────────────────────────────────────────────
max_steps: 15  # 추론과 동일한 ppo_v2 에피소드 길이
target_dsc: 1.0          # 0.88 → 1.0: 초정밀 보정 학습을 위해 조기종료 비활성화 (1.0 도달 시만 종료)
step_penalty: 0.001       # 0.005 → 0.001: 탐색 억제 최대한 완화

# ──────────────────────────────────────────────
# PPO 하이퍼파라미터
# ──────────────────────────────────────────────
total_timesteps: 100000  # 16 vCPU 파드에서 반복 학습을 짧게
n_envs: 8                 # vCPU 16. 환경 스텝은 프로세스별로 병렬
n_steps: 1024  # 2026-08-20 기준
batch_size: 256           # 64 → 256: 더 큰 배치로 그래디언트 안정화
n_epochs: 4               # 10 → 4: GPU 업데이트 횟수를 줄임
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01            # 0.02 → 0.01: 충분한 학습 후 탐색 일부 유지
learning_rate: 0.0001     # 0.0003 → 0.0001: 더 세밀한 학습률으로 수렴 안정화

# 정류 네트워크 (더 깊고 넓은 구조로 복잡한 보정 패턴 학습)
net_arch: [512, 256, 128]

# ──────────────────────────────────────────────
# Stop Motion
# ──────────────────────────────────────────────
# Medium/Large Expert의 rough DSC(0.92/0.94)가 이미 기본 임계값 0.92를 넘어서
# 첫 체크(2048 스텝)에서 즉시 중단되므로 비활성화한다.
stop_dsc_target: 0

# Plateau Stop 도 비활성화한다. 세 에이전트 모두 total_timesteps 를 완주시킨다.
stop_plateau: false

# ──────────────────────────────────────────────
# 저장 경로
# ──────────────────────────────────────────────
save_path: "checkpoints/ppo_refiner"
log_path: "logs/ppo"
unet_checkpoint: "checkpoints/segresnet_best.pt"
model_type: "segresnet"


# 논문용 기본 프로필: 학습과 추론 입력 정합
refinement_profile: ppo_v2
stage2_thresholds: "0.80,0.80,0.50"
cc_min_sizes: "0,15,25"
