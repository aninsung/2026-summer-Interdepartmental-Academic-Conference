# PPO 에이전트 학습 설정
# 사용 예시: python train_agent.py --config configs/ppo_brats.yaml

# ──────────────────────────────────────────────
# 데이터 설정
# ──────────────────────────────────────────────
# 실제 BraTS 데이터 사용 여부
use_real_data: true

# BraTS2021 데이터 경로 (압축 해제된 폴더)
# BraTS2021은 train/val 분리가 없으므로 동일 경로를 사용하고
# train_agent.py 에서 80/20 분할합니다.
train_root: "src/data/archive"

# MRI 모달리티: t1ce+flair (T1ce + FLAIR 2채널 입력)
modality: "t1ce+flair"

# 2D 슬라이스 해상도
image_size: 128

# 환자 수 제한 (null이면 전체 사용, 빠른 테스트 시 숫자로 제한)
# BraTS2021 전체: 약 1251명 → null 이면 전체 사용
# 테스트 시: 20~50 으로 설정
max_train_patients: 300   # 100 → 300: 더 많은 환자 데이터로 다양한 종양 패턴 학습

# 합성 데이터 설정 (use_real_data: false 시 사용, 현재 미사용)
num_samples: 300

# ──────────────────────────────────────────────
# RL 환경 설정
# ──────────────────────────────────────────────
max_steps: 30             # 에피소드당 최대 스텝 수 (20 → 30: 더 많은 학습 기회)
target_dsc: 1.0          # 0.88 → 1.0: 초정밀 보정 학습을 위해 조기종료 비활성화 (1.0 도달 시만 종료)
step_penalty: 0.001       # 0.005 → 0.001: 탐색 억제 최대한 완화

# ──────────────────────────────────────────────
# PPO 하이퍼파라미터
# ──────────────────────────────────────────────
total_timesteps: 300000    # 80K → 300K: 충분한 수렴을 위한 스텝 수 대폭 확대
n_envs: 8                 # 병렬 환경 수 8개 유지
n_steps: 1024             # 512 → 1024: 더 많은 롤아웃 경험으로 폴리시 안정화
batch_size: 256           # 64 → 256: 더 큰 배치로 그래디언트 안정화
n_epochs: 10              # 4 → 10: 더 많은 업데이트 횟수
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01            # 0.02 → 0.01: 충분한 학습 후 탐색 일부 유지
learning_rate: 0.0001     # 0.0003 → 0.0001: 더 세밀한 학습률으로 수렴 안정화

# 정류 네트워크 (더 깊고 넓은 구조로 복잡한 보정 패턴 학습)
net_arch: [512, 256, 128]

# ──────────────────────────────────────────────
# 저장 경로
# ──────────────────────────────────────────────
save_path: "checkpoints/ppo_refiner"
log_path: "logs/ppo"
unet_checkpoint: "checkpoints/segresnet_best.pt"
model_type: "segresnet"

