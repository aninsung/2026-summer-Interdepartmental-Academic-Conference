# PPO 에이전트 학습 설정
# 사용 예시: python train_agent.py --config configs/ppo_brats.yaml

# ──────────────────────────────────────────────
# 데이터 설정
# ──────────────────────────────────────────────
# 실제 BraTS 데이터 사용 여부
use_real_data: true

# BraTS2021 데이터 경로 (압축 해제된 폴더)
# BraTS2021은 train/val 분리가 없으므로 동일 경로를 사용하고
# train_agent.py 에서 80/20 분할합니다.
train_root: "src/data/archive"

# MRI 모달리티: t1ce+flair (T1ce + FLAIR 2채널 입력)
modality: "t1ce+flair"

# 2D 슬라이스 해상도
image_size: 128

# 환자 수 제한 (null이면 전체 사용, 빠른 테스트 시 숫자로 제한)
# BraTS2021 전체: 약 1251명 → null 이면 전체 사용
# 테스트 시: 20~50 으로 설정
max_train_patients: 100   # null → 100: 300K 스텝이 의미 있도록 데이터 수 제한

# 합성 데이터 설정 (use_real_data: false 시 사용, 현재 미사용)
num_samples: 300

# ──────────────────────────────────────────────
# RL 환경 설정
# ──────────────────────────────────────────────
max_steps: 30             # 에피소드당 최대 스텝 수 (20 → 30: 더 많은 학습 기회)
target_dsc: 0.88          # 0.95 → 0.88: SegResNet rough DSC≈0.85 기준 현실적 조기종료 목표
step_penalty: 0.005       # 0.01 → 0.005: 탐색 억제 완화

# ──────────────────────────────────────────────
# PPO 하이퍼파라미터
# ──────────────────────────────────────────────
total_timesteps: 80000    # 80K: 빠른 고속 강화학습 수렴 및 시간 절감 (약 2~3분 내 수렴)
n_envs: 8                 # 병렬 환경 수를 8개로 확장하여 학습 속도 극대화
n_steps: 512
batch_size: 64
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.02            # 0.01 → 0.02: 탐색 강화 (에이전트가 action=2 유지에만 수렴하는 현상 완화)
learning_rate: 0.0003

# 정책 네트워크
net_arch: [256, 256]

# ──────────────────────────────────────────────
# 저장 경로
# ──────────────────────────────────────────────
save_path: "checkpoints/ppo_refiner"
log_path: "logs/ppo"
unet_checkpoint: "checkpoints/segresnet_best.pt"
model_type: "segresnet"

